apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: tradeops-require-container-security
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, statefulsets]
  matchConditions:
    - name: tradeops-namespace
      expression: "object.metadata.namespace == 'tradeops'"
  validations:
    - message: Containers must disable privilege escalation and drop ALL capabilities.
      expression: >-
        object.spec.template.spec.containers.all(c,
          has(c.securityContext) &&
          has(c.securityContext.allowPrivilegeEscalation) &&
          c.securityContext.allowPrivilegeEscalation == false &&
          has(c.securityContext.capabilities) &&
          has(c.securityContext.capabilities.drop) &&
          c.securityContext.capabilities.drop.exists(x, x == 'ALL'))
