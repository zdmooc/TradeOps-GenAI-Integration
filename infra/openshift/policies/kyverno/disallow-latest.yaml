apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: tradeops-disallow-latest
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, statefulsets]
  matchConditions:
    - name: tradeops-namespace
      expression: "object.metadata.namespace == 'tradeops'"
  validations:
    - message: Container images must use an explicit non-latest tag.
      expression: >-
        object.spec.template.spec.containers.all(c,
          c.image.contains(':') && !c.image.endsWith(':latest'))
