{{ range $name, $app := .Values.apps }}
{{ if $app.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- include "tradeops.labels" $ | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/part-of: tradeops
    spec:
      serviceAccountName: {{ $.Values.serviceAccount.name }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "tradeops.podSecurityContext" $ | nindent 8 }}
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.global.image.repository }}:{{ $.Values.global.image.tag }}"
          imagePullPolicy: {{ $.Values.global.image.pullPolicy }}
          command: ["python", "-m", "{{ $app.module }}"]
          env:
            {{- range $key, $value := $.Values.global.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: SERVICE_NAME
              value: {{ $name | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.global.secretName }}
                  key: POSTGRES_PASSWORD
            {{- if $app.port }}
            - name: PORT
              value: {{ $app.port | quote }}
            {{- end }}
            {{- with $app.env }}
            {{- range $key, $value := . }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- with $app.secretEnv }}
            {{- range $secret := . }}
            - name: {{ $secret.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.global.secretName }}
                  key: {{ $secret.secretKey }}
            {{- end }}
            {{- end }}
          securityContext:
            {{- include "tradeops.containerSecurityContext" $ | nindent 12 }}
          resources:
            {{- toYaml $app.resources | nindent 12 }}
          {{- if $app.port }}
          ports:
            - name: http
              containerPort: {{ $app.port }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          {{- end }}
---
{{ if $app.port }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- include "tradeops.labels" $ | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: {{ $app.port }}
      targetPort: http
---
{{ end }}
{{ end }}
{{ end }}
