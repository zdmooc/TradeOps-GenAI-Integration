{{ if .Values.platform.postgres.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  labels:
    app.kubernetes.io/name: postgres
    {{- include "tradeops.labels" . | nindent 4 }}
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS workflows (
      workflow_id UUID PRIMARY KEY,
      status TEXT NOT NULL,
      payload JSONB NOT NULL,
      confidence_score NUMERIC NULL,
      decision TEXT NULL,
      reviewer TEXT NULL,
      created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
      updated_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    CREATE TABLE IF NOT EXISTS orders (
      order_id UUID PRIMARY KEY,
      workflow_id UUID NOT NULL,
      status TEXT NOT NULL,
      symbol TEXT NOT NULL,
      side TEXT NOT NULL,
      qty NUMERIC NOT NULL,
      fill_price NUMERIC,
      created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    CREATE TABLE IF NOT EXISTS audit_logs (
      audit_id BIGSERIAL PRIMARY KEY,
      kind TEXT NOT NULL,
      ref_id TEXT NOT NULL,
      data JSONB NOT NULL,
      hash TEXT NOT NULL,
      correlation_id UUID NOT NULL,
      created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    CREATE INDEX IF NOT EXISTS idx_audit_ref ON audit_logs(ref_id);
    CREATE INDEX IF NOT EXISTS idx_audit_kind ON audit_logs(kind);
    CREATE INDEX IF NOT EXISTS idx_audit_correlation ON audit_logs(correlation_id);
    CREATE INDEX IF NOT EXISTS idx_workflows_status ON workflows(status);
    CREATE INDEX IF NOT EXISTS idx_workflows_decision ON workflows(decision);
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    {{- include "tradeops.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    {{- include "tradeops.labels" . | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: tradeops
    spec:
      securityContext:
        {{- include "tradeops.podSecurityContext" . | nindent 8 }}
      containers:
        - name: postgres
          image: {{ .Values.platform.postgres.image | quote }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.global.env.POSTGRES_DB | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.global.env.POSTGRES_USER | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretName }}
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          securityContext:
            {{- include "tradeops.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.platform.postgres.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "tradeops", "-d", "tradeops"]
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init
          configMap:
            name: postgres-init
{{ if .Values.crc.ephemeralPlatformStorage }}
        - name: data
          emptyDir: {}
{{ end }}
{{ if not .Values.crc.ephemeralPlatformStorage }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.platform.postgres.storage }}
{{ end }}
---
{{ end }}
{{ if .Values.platform.redpanda.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  labels:
    app.kubernetes.io/name: redpanda
    {{- include "tradeops.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: redpanda
  ports:
    - name: kafka
      port: 9092
      targetPort: kafka
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
  labels:
    app.kubernetes.io/name: redpanda
    {{- include "tradeops.labels" . | nindent 4 }}
spec:
  serviceName: redpanda
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redpanda
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redpanda
        app.kubernetes.io/part-of: tradeops
    spec:
      securityContext:
        {{- include "tradeops.podSecurityContext" . | nindent 8 }}
      containers:
        - name: redpanda
          image: {{ .Values.platform.redpanda.image | quote }}
          args:
            - redpanda
            - start
            - --overprovisioned
            - --smp
            - "1"
            - --memory
            - 512M
            - --reserve-memory
            - 0M
            - --check=false
            - --kafka-addr
            - PLAINTEXT://0.0.0.0:9092
            - --advertise-kafka-addr
            - PLAINTEXT://redpanda:9092
          ports:
            - name: kafka
              containerPort: 9092
          securityContext:
            {{- include "tradeops.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.platform.redpanda.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: kafka
            initialDelaySeconds: 8
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/redpanda/data
            - name: config
              mountPath: /etc/redpanda
      volumes:
        - name: config
          emptyDir: {}
{{ if .Values.crc.ephemeralPlatformStorage }}
        - name: data
          emptyDir: {}
{{ end }}
{{ if not .Values.crc.ephemeralPlatformStorage }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.platform.redpanda.storage }}
{{ end }}
---
{{ end }}
