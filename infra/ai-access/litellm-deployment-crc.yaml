apiVersion: v1
kind: ConfigMap
metadata:
  name: d090-litellm-config
  namespace: tradeops
data:
  config.yaml: |
    model_list:
      - model_name: tradeops-default
        litellm_params:
          model: os.environ/TRADEOPS_LITELLM_MODEL
          api_key: os.environ/LITELLM_PROVIDER_API_KEY
      - model_name: odm-extraction
        litellm_params:
          model: os.environ/TRADEOPS_LITELLM_MODEL
          api_key: os.environ/LITELLM_PROVIDER_API_KEY
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
    litellm_settings:
      set_verbose: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: tradeops
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/part-of: tradeops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm
        app.kubernetes.io/part-of: tradeops
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:v1.103.0
          args: ["--config", "/app/config.yaml"]
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: tradeops-runtime-secrets
                  key: LITELLM_API_KEY
            - name: LITELLM_PROVIDER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: tradeops-runtime-secrets
                  key: LITELLM_PROVIDER_API_KEY
            - name: TRADEOPS_LITELLM_MODEL
              valueFrom:
                configMapKeyRef:
                  name: d090-ai-model
                  key: model
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
          readinessProbe:
            httpGet: {path: /health/readiness, port: http}
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health/liveliness, port: http}
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            runAsNonRoot: true
      volumes:
        - name: config
          configMap:
            name: d090-litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: tradeops
spec:
  selector:
    app.kubernetes.io/name: litellm
  ports:
    - name: http
      port: 4000
      targetPort: http
