apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: tradeops
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/part-of: tradeops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm
        app.kubernetes.io/part-of: tradeops
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:v1.103.0
          args: ["--config", "/app/config.yaml"]
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: tradeops-runtime-secrets
                  key: LITELLM_API_KEY
            - name: LITELLM_PROVIDER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: tradeops-runtime-secrets
                  key: LITELLM_PROVIDER_API_KEY
                  optional: true
            - name: TRADEOPS_LITELLM_MODEL
              valueFrom:
                configMapKeyRef:
                  name: d090-ai-model
                  key: model
            - name: TRADEOPS_LITELLM_API_BASE
              valueFrom:
                configMapKeyRef:
                  name: d090-ai-model
                  key: api_base
                  optional: true
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
          startupProbe:
            httpGet: {path: /health/liveliness, port: http}
            periodSeconds: 10
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /health/readiness, port: http}
            initialDelaySeconds: 120
            periodSeconds: 15
            failureThreshold: 8
          livenessProbe:
            httpGet: {path: /health/liveliness, port: http}
            initialDelaySeconds: 120
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            runAsNonRoot: true
      volumes:
        - name: config
          configMap:
            name: d090-litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: tradeops
spec:
  selector:
    app.kubernetes.io/name: litellm
  ports:
    - name: http
      port: 4000
      targetPort: http
