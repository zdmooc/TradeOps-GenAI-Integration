name: ci
on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: python scripts/security_audit.py
      - run: python scripts/generate_sbom.py --check
      - run: helm lint infra/helm/tradeops -f infra/helm/tradeops/values-crc.yaml
      - run: helm template tradeops infra/helm/tradeops --namespace tradeops -f infra/helm/tradeops/values.yaml -f infra/helm/tradeops/values-crc.yaml > /tmp/tradeops-i9.yaml
      - run: python scripts/i9_validate_platform.py
      - run: pytest -q
