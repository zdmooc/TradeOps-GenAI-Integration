name: ci
on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.2"
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: python scripts/security_audit.py
      - run: python scripts/generate_sbom.py --check
      - run: python scripts/validate_wiki.py
      - name: Validate CRC shell scripts
        run: bash -n scripts/i9_crc_deploy.sh scripts/r5_crc_mcp_mq_deploy.sh scripts/r5_crc_mcp_mq_verify.sh scripts/r5_crc_mcp_mq_run.sh scripts/d090_bootstrap_oidc_crc.sh scripts/d090_prepare_crc.sh scripts/d090_deploy_litellm_crc.sh scripts/d090_enable_genai_crc.sh scripts/d090_run_g1_live_crc.sh
      - name: Validate D-090 LiteLLM CRC hardening
        shell: bash
        run: |
          grep -q 'startupProbe:' infra/ai-access/litellm-deployment-crc.yaml
          grep -q 'initialDelaySeconds: 120' infra/ai-access/litellm-deployment-crc.yaml
          grep -q 'D090_LITELLM_ROLLOUT=PASS' scripts/d090_deploy_litellm_crc.sh
      - run: npm install --no-audit --no-fund
        working-directory: frontend/tradeops-ui
      - run: npm run build
        working-directory: frontend/tradeops-ui
      - run: helm lint infra/helm/tradeops -f infra/helm/tradeops/values-crc.yaml
      - run: helm template tradeops infra/helm/tradeops --namespace tradeops -f infra/helm/tradeops/values.yaml -f infra/helm/tradeops/values-crc.yaml > /tmp/tradeops-i9.yaml
      - run: python scripts/i9_validate_platform.py
      - run: python scripts/i10_validate_ai_serving.py
      - run: python scripts/i13_validate_web_cockpit.py
      - run: python scripts/d090_validate_ai_access.py
      - run: python scripts/d092_validate_a2a.py
      - run: helm template tradeops-ai-access infra/helm/tradeops --namespace tradeops -f infra/helm/tradeops/values.yaml -f infra/ai-access/values-ai-access.example.yaml > /tmp/tradeops-d090.yaml
      - run: helm template tradeops-a2a infra/helm/tradeops --namespace tradeops -f infra/helm/tradeops/values.yaml -f infra/ai-access/values-a2a.example.yaml > /tmp/tradeops-d092-a2a.yaml
      - run: terraform fmt -check -recursive
        working-directory: infra/azure-enterprise/terraform
      - run: terraform init -backend=false -input=false
        working-directory: infra/azure-enterprise/terraform
      - run: terraform validate -no-color
        working-directory: infra/azure-enterprise/terraform
      - run: python scripts/i11_validate_azure_target.py
      - run: python scripts/i12_graduation_check.py --expect-status NOT_GRADUATED
      - run: pytest -q
