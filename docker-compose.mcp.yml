services:
  agent-controller:
    environment:
      MCP_NATIVE_URL: http://mcp-native:8017/mcp
    depends_on:
      mcp-native:
        condition: service_started

  mcp-native:
    build:
      context: .
      dockerfile: services/mcp_native/Dockerfile
    env_file: .env
    environment:
      SERVICE_NAME: mcp-native
      MCP_NATIVE_RESOURCE_URL: ${MCP_NATIVE_RESOURCE_URL:-http://mcp-native:8017/mcp}
    ports:
      - "8017:8017"
